name: reproduce

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: corpus/v1
          key: corpus-${{ hashFiles('corpus/v1.json') }}
      - run: python fetch.py v1
      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 469659e0617345149cd1eaec2e643d61d130aa6a
          path: inputs/godot-docs
          sparse-checkout: doc/classes
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: curl -sSfL --create-dirs -o inputs/extension_api-4-7.json https://raw.githubusercontent.com/godotengine/godot-cpp/8070599885b6df675fcad033dd032ce44be2b850/gdextension/extension_api-4-7.json
      - run: python reproduce.py
